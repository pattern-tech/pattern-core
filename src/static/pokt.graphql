	GetStakeWeightRewardsForSelection(input: NodeSelectionInput!): GetStakeWeightRewardsForSelectionResponse!

	# Get rewards data of the network grouped by chain and by unit between the date range selected.
	GetChainRewardsByUnitBetweenDates(input: GetChainRewardsByUnitBetweenDatesInput!): GetChainRewardsByUnitBetweenDatesResponse!

	# Get rewards data of your selected nodes grouped by chain and by unit between the date range selected.
	GetChainRewardsForSelectionByUnitBetweenDates(input: GetForSelectionByUnitWithoutHourBetweenDatesInput!): GetChainRewardsForSelectionByUnitBetweenDatesResponse!

	# Get rewards data grouped by chain for the selected nodes in the date range selected.
	GetChainsRewardsForSelectionBetweenDates(input: NodeSelectionBetweenDatesInput!): [ChainRewardsForSelection]!

	# Divide the amount of nodes in segments (ranges) based on the relays they have done between the last 24 hours for the selected nodes
	GetNodeRelaysBySegmentsForSelectionOnLast24hrs(input: GetNodeRelaysBySegmentsForSelectionOnLast24hrsInput!): [SegmentNode!]!

	# Get the total rewards grouped by the selected nodes in the date range specified
	GetTotalRewardsForSelectionBetweenDates(input: GetForSelectionByUnitWithoutHourBetweenDatesInput!): GetTotalRewardsForSelectionBetweenDatesResponse!

	# Get the amount of nodes validators divided by segments (ranges) of the staked tokens only considering the selected nodes.
	# Each range have the length of the average unless is the first and last segment.
	GetValidatorsStakedTokensDistributionForSelection(input: NodeSelectionInput!): GetValidatorsStakedTokensDistributionResponse!

	# List transactions of the pokt network passing the nodes selected as an OR filter to filter the transactions using in from_address and to_address the addresses of the nodes selected
	ListPoktTransactionForSelection(input: ListPoktTxPaginationForSelectionInput!): ListPoktTransactionResponse

	# List transfer of the pokt network passing the nodes selected as an OR filter to filter the transactions using in from_address and to_address the addresses of the nodes selected
	ListPoktTransferForSelection(input: ListPoktTxPaginationForSelectionInput!): ListPoktTransferResponse

	# Get a summary of the transactions that were sent or received by the selected nodes
	GetTransactionSummaryForSelectionBetweenDates(input: GetTransactionSummaryForSelectionBetweenDatesInput!): TransactionSummary!

	# List the performance of the nodes
	ListNodePerformance(pagination: ListInput!): ListNodePerformanceResponse!

	# Get a node performance by its address or service_url
	GetNodePerformance(property: String, value: ID!): NodePerformance

	# List the performance of the selected nodes by passing an AND filter to filter the nodes performance using the nodes addresses
	ListNodePerformanceForSelection(input: ListPoktPaginationForSelectionInput!): ListNodePerformanceResponse

	# List all relays items (valid proof transactions) in the history of the Pocket Network
	ListPoktRelays(pagination: ListInput!): ListPoktRelayResponse!

	# Select nodes with the node_selection input and add more filters using the filter input and you would get the total and average of tokens staked by nodes in
	# the latest block and the average of relays by the nodes in the last 24 hours.
	GetAvgAndTotalsOfStakeAndRelaysForSelectionInLast24hrs(input: GetAvgAndTotalsOfStakeAndRelaysForSelectionInLast24hrsInput!): StakedAndRelaysAveragesAndTotals!

	# Get the total relays served by the selected nodes in their history grouped by chain
	GetRelaysByChainInHistoryForSelection(input: NodeSelectionInput!): [NodeChainRelays]!

	# Get a rewards summary for the selected nodes grouped by the unit time selected and between the date ranges selected
	GetRewardsReportForSelectionByUnitBetweenDates(input: GetForSelectionByUnitWithoutHourBetweenDatesInput!): GetRewardsReportForSelectionBetweenDatesResponse!

	# Get the addresses of the selected nodes grouped by their output address and/or their stake weight multiplier.
	GetAddressesByOutputAndWeightForSelection(input: NodeSelectionInput): GetAddressesByOutputAndWeightForSelectionResponse!

	# List the node gateway errors in the last 3 days
	ListPoktNodeGatewayError(pagination: ListInput): ListPoktNodeGatewayErrorResponse

	# List the node gateway errors in the last 3 days of the selected nodes by passing an AND filter to filter the nodes gateway errors using the nodes addresses
	ListPoktNodeGatewayErrorForSelection(input: ListPoktPaginationForSelectionInput!): ListPoktNodeGatewayErrorResponse

	# Get a health summary for the selected nodes. We use the start_date and end_date as the date range to count the amount of errors this nodes had between the date range.
	GetHealthSummaryForSelection(input: NodeSelectionBetweenDatesInput!): HealthSummaryNodeSelection!

	# Metrics grouped by gateway and by chain only considering the selected nodes. At this moment we only store the data for the last 72 hours. This data is slow to process so we do it every few hours.
	GetMetricsByGatewayAndChainForSelection(input: NodeSelectionInput!): GetMetricsByGatewayAndChainForSelectionResponse!

	# Metrics grouped by gateway and by chain considering all the nodes in the network. At this moment we only store the data for the last 72 hours. This data is slow to process so we do it every few hours.
	GetMetricsByGatewayAndChainForNetwork: GetMetricsByGatewayAndChainForSelectionResponse!

	# Get the amount of relays by chain and the amount of relays by chain and by gateway in the last 72 hours of the network.
	GetRelaysByChainAndGatewayReport: GetRelaysByChainAndGatewayReportResponse!

	# Get the rewards and relays for the node selection between the specified date range and grouped by the selected granularity.
	GetRewardsByGranularityForSelectionBetweenDates(input: GetRewardsByGranularityForSelectionBetweenDatesInput!): RewardsForSelection!

	# Get the array of addresses by passing the group id of that array
	GetNodeAddressesByGroup(input: GetNodeAddressesByGroupInput!): [String!]!

	# List the node and app growth by chain between the date range specified.
	ListNodeAndAppGrowthByChainBetweenDates(input: ListNodeAndAppGrowthByChainBetweenDatesInput!): ListNodeAndAppGrowthByChainBetweenDatesResponse!

	# Get the amount of staked nodes and apps by chain in the last block.
	GetStakedNodesAndAppsByChain(input: GetStakedNodesAndAppsByChainInput!): GetStakedNodesAndAppsByChainResponse!

	# Get network performance data report by chains.
	GetChainsNetworkDataReport(input: GetChainsNetworkDataReportInput!): [ChainNetworkDataReportSummary]!

	# Get Chains Performance Report for the last 30 days and last 24 hours.
	GetChainsPoktEarnPerformanceReport(chain: String!): GetChainsPoktEarnPerformanceReportResponse!

	# Get Pokt Network parameters with their current values.
	GetLastBlockPoktParams: GetLastBlockPoktParamsResponse!

	# Get an array of all active chains in the network with their activation time and height.
	GetActiveChains: [ActiveChainItem]!

	# List dao expenses amount in uPOKT between the date range specified.
	ListDaoExpensesBetweenDates(input: SummaryWithBlockInput!): ListDaoExpensesBetweenDatesResponse!

	# List dao burn amount in uPOKT between the date range specified.
	ListDaoBurnBetweenDates(input: SummaryWithBlockInput!): ListDaoBurnBetweenDatesResponse!

	# Get the supply summary passing the start date and using the current date as end date
	GetSupplySummaryFromStartToCurrentDate(input: GetSupplySummaryFromStartDateInput!): GetSupplySummaryFromStartDateResponse!

	# Get the DAO treasury by the blocks between the provided date range.
	GetDaoBalanceByBlockBetweenDates(input: BetweenDatesInput!): [AmountByBlock!]!

	# Get POKT price related data such as price in usd and the percent change in the last 24hs.
	GetPoktPriceInfo: GetPoktPriceInfoResponse!

	# List app burn rate by unit between the provided date range.
	ListAppBurnRateBetweenDates(input: ListAppBurnRateBetweenDatesInput!): ListAppBurnRateBetweenDatesResponse

	# Get relevant data grouped by domain in the latest block.
	GetDataByDomain: GetDataByDomainResult!

	# Get relays grouped by gateway and chain between the date range selected.
	GetRelaysByGatewayAndChainBetweenDates(input: GetChainsRewardsBetweenDatesInput!): [RelaysByGatewayAndChain]!

	# Get relays of the network grouped by gateway and by unit between the date range selected.
	ListRelaysByGatewayAndUnitBetweenDates(input: ListRelaysByGatewayAndUnitBetweenDatesInput!): ListRelaysByGatewayAndUnitBetweenDatesResponse!

	# Get the balance of the Wrapped uPOKT account vault (2eb054616797de8565506333afb334655e7774ed) by unit time between the date range selected.
	ListWrappedPoktBalanceByUnitBetweenDates(input: ListWrappedPoktBalanceByUnitBetweenDatesInput!): ListWrappedPoktBalanceByUnitBetweenDatesResponse!

	# Get the nodes that delegates rewards to the address passed as input and the percent of rewards the nodes delegates. 
	GetNodesDelegateRewardsToAccount(
	# Address of the account 
	address: String!
	): [PercentByAddress!]!

	# Get the accounts the nodes in the input has as delegators. 
	GetDelegatorsBySelection(input: NodeSelectionInput!): [DelegatorsBySelectionItem!]!

	# Get the rewards the delegators of the nodes in the selection received in the last 48, 24 and 6 hours. 
	GetRewardsOfDelegatorsBySelection(input: NodeSelectionInput!): [RewardsPerHourByAddress!]!

	# Get the rewards generated by the selected nodes in the date range specified
	# grouped by address (the account that received the rewards, it can be delegators, operator, custodian)
	GetRewardsByAddressForSelectionBetweenDates(input: GetForSelectionByUnitWithoutHourBetweenDatesInput!): GetRewardsByAddressForSelectionBetweenDatesResponse!

	# Get the pending balance of the accounts in the selection.
	# You can search by accounts using addresses and by nodes using the other fields.
	GetPendingBalanceByAddressForSelection(input: NodeSelectionInput!): [PendingBalanceByAddress!]!

	# Get a summary of the transfers that were sent or received by the selected accounts or nodes
	GetTransferSummaryForSelectionBetweenDates(input: GetTransactionSummaryForSelectionBetweenDatesInput!): TransferSummaryResponse!

	# Get all the gateway regions we scrape to have their metrics.
	GetAllGatewayRegions: [GatewayRegion!]!

	# Get the gateway metrics report where the values are group by the region and the chain.
	# You can pass a gateway id if you want to consider only one gateway.
	GetLast24hGatewayMetrics(gateway_id: Int): [GatewayMetrics!]!

	# Get the gateway metrics report where the values are group by the region and gateway.
	# You must pass a chain id to filter the data by this chain.
	GetLast24hGatewayMetricsByChain(chain: String!): [GatewayMetricsByChain!]!

	# Get the gateway metrics report by the nodes you specify where the values are group by the region and the chain.
	# You can pass a gateway id if you want to consider only one gateway.
	GetLast24hGatewayMetricsByNodeSelection(input: GetLast24hGatewayMetricsByNodesInput!): [GatewayMetrics!]!

	# List the errors that we have received from the different gateways filtering by selected nodes
	ListNodeErrorsFromGatewayMetrics(input: ListPoktPaginationForSelectionInput!): ListErrorsFromGatewayMetricsResponse!

	# Get the list of domains for the selected nodes 
	GetServiceDomainsByNodeSelection(input: GetServiceDomainsByNodeSelectionInput!): [String!]!

	# Get a result of what services you should stake to get the best results for your nodes
	GetWhatToStake(input: WtsProcessRequestInput!): WtsOptimizationResponse!
	GetDelegatorRewardsBetweenDates(input: GetDelegatorRewardsBetweenDatesInput!): [DelegatorRewards!]!

	# Get a summary of the chain.
	GetChainSummary(chain: String!): ChainSummary!
