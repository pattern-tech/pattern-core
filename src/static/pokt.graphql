	unit_time: UnitTimeGroup!

	# The number of intervals by which the data will be grouped. By default it is: 1.
	# For example: if you have day as unit_time and specify 2 as interval, the data will be grouped by every two days.
	interval: Int = 1

	# This is the format to convert the string to date. By default is: YYYY-MM-DD.
