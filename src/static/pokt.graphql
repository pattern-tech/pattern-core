	# Start date of the date range. 
	start_date: String!

	# End date of the date range. 
	end_date: String!

	# This is the format to convert the string to date. By default is: YYYY-MM-DDTHH:mm:ss.SSSZ.
	# But if you want to use another format supported by momentjs you can pass it here.
	# More about momentjs formats: https://momentjs.com/docs/#/displaying/format/
	# When using hour as unit_time we recommend to use YYYY-MM-DDTHH:mm:ss.SSSZ as format.
	date_format: String = "YYYY-MM-DDTHH: mm: ss.SSSZ"

	# Pass the timezone of the start date and end date. By default is UTC.
	# # List of supported timezones: https://gist.github.com/diogocapela/12c6617fc87607d11fd62d2a4f42b02a#file-moment-js-timezones-txt
	timezone: String = "UTC"
