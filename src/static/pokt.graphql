enum CacheControlScope {
	PUBLIC
	PRIVATE
}

enum ErrorLayer {
	Input
	Response
	Datasource
	Cache
}

type Error {
	code: String!
	message: String!
	timestamp: String!
	layer: ErrorLayer!
	stack_trace: [String]
}

type PaginationResponse {
	# True if have a previous page
	has_previous: Boolean!

	# True if have a next page
	has_next: Boolean!

	# Cursor of the previous page
	previous: ID

	# Cursor of the next page
	next: ID
	totalCount: Int
}

type UpdateManyResponse {
	matched_count: Boolean!
	modified_count: Boolean!
	success: Boolean!
}

input SortInput {
	# The property you want to sort by
	property: String!

	# The direction you want to sort. Accept two values: 1 for ascending and -1 for descending
	direction: Int!
}

enum FilterOperatorType {
	# The records should match all the filters
	AND

	# The records should match at least one of the conditions
	OR
}

enum FilterPropertyType {
	# Equal to
	EQ

	# Not equal to
	NE

	# Greater than
	GT

	# Greater than or equal to
	GTE

	# Lesser than
	LT

	# Lesser than or equal to
	LTE

	# Regex Operation that do no accept options, only the i is set by default
	REGEX

	# Check if the records have one or more of the passed items in value
	IN

	# Text search
	TEXT

	# Check if field exists
	EXISTS
}

enum FilterPropertyValueType {
	# Text
	STRING

	# Number without decimals
	INT

	# Number with decimals
	FLOAT

	# True or false
	BOOLEAN

	# Date in ISO format
	DATE
	NULL
}

input FilterPropertyInput {
	# Property to apply the filter
	property: String!

	# Operator of the filter
	operator: FilterPropertyType!

	# Type of the value
	type: FilterPropertyValueType!

	# The value passed here will be converted to the type selected
	value: String!
}

input FilterInput {
	# The operator of the filter. If AND then the records should match all the filters and if OR the records should match at least one of the conditions
	operator: FilterOperatorType!

	# Set of property filters
	properties: [FilterPropertyInput!]!

	# Set of filters inputs
	filters: [FilterInput!]
}

input ListInput {
	# Cursor of the page
	cursor: ID

	# Specify the amount of items you want to receive
	limit: Int!

	# Array of sort input
	sort: [SortInput!]

	# With this input you can filter the items
	filter: FilterInput

	# If true include the total count that match the filter
	includeCount: Boolean
}

scalar BigInt

type TotalByType {
	type: String!
	total: BigInt!
}

type Point {
	point: String!
	start_date: String!
	end_date: String!
}

enum UnitTimeGroup {
	hour
	day
	week
	month
	year
}

enum UnitTimeGroupWithBlock {
	block
	hour
	day
	week
	month
	year
}

enum UnitTimeGroupWithoutHour {
	day
	week
	month
	year
}

input ServiceUrlItemInput {
	address: String
	service_url: String
	service_domain: String
	status: Int
	partial_url: String
	service_urls_count: Int
}

input NodesSelectionInput {
	addresses: [String]!
}

type Account {
	# ID of the record 
	_id: ID!

	# Address of the account 
	address: ID!

	# Height of the last block in which this account was scanned 
	height: Int!

	# Time of the last block in which this account was scanned 
	block_time: String!

	# Public key of the account 
	public_key: ID!

	# Balance (in uPOKT) of the account 
	amount: BigInt!

	# Time in which this record was parsed from RPC to our database 
	parse_time: String!
}

type ListPoktAccountResponse {
	items: [Account]
	pageInfo: PaginationResponse
}

type MigratedApp {
	# Address of the from/to app 
	address: String!

	# Chains staked at migration time  
	chains: [String!]!

	# Tokens staked (in uPOKT) at migration time  
	tokens: BigInt!

	# Height of the block when the migration occurred  
	height: BigInt!

	# Datetime of the block when the migration occurred  
	block_time: String!
}

type App {
	# Time of the last block in which this app was scanned 
	block_time: String!

	# Height of the last block in which this app was scanned 
	height: Int!

	# Public key of the app 
	public_key: ID!

	# Address of the app 
	address: ID!

	# Balance (in uPOKT) of the account of the app 
	balance: BigInt!

	# Status of the app. Can be three: staked (2), unstaking (1) and unstaked (0) 
	status: Int!

	# Ids of the chains this app support 
	chains: [String!]!

	# Tokens (in uPOKT) this app have staked/unstaking 
	tokens: BigInt!

	# Max amount of relays that a node in a session with this app can serve 
	max_relays: BigInt!

	# Time in which this app start the unstaking process 
	unstaking_time: String!

	# Time in which this record was parsed from RPC to our database 
	parse_time: String!

	# Data of the migration when the app was migrated from another one. 
	migrated_from: MigratedApp

	# Data of the migration when the app was migrated to another one. 
	migrated_to: MigratedApp

	# Id of the gateway (Portal) that uses this app 
	gateway_id: Int
}

type ListPoktAppResponse {
	# Apps in this page 
	items: [App]

	# Info related to the current page of the list 
	pageInfo: PaginationResponse
}

type BlockSupply {
	# Nodes tokens (in uPOKT) staked supply 
	node_staked: BigInt!

	# Apps tokens (in uPOKT) staked supply 
	app_staked: BigInt!

	# DAO tokens (in uPOKT) supply 
	dao: BigInt!

	# Total Stake tokens (in uPOKT) supply 
	total_staked: BigInt!

	# Total unstaked tokens (in uPOKT) supply 
	total_unstaked: BigInt!

	# Total tokens (in uPOKT) supply 
	total: BigInt!
}

type StakeByChain {
	# Id of the chain 
	chain: String!

	# amount of items that support this chain 
	amount: BigInt!
}

type Monetary {
	# Amount of staked tokens in this block 
	ms: BigInt

	# Amount of tokens in the circulating accounts (wallets) in this block 
	m0: BigInt

	# Sum of the amount of tokens in the circulating accounts (wallets) and the amount of staked tokens in this block 
	mb: BigInt

	# Amount of unstaking tokens in this block 
	mu: BigInt
}

type StakeWeightSummary {
	# Stake weight multiplier 
	weight: Float!

	# Staked nodes with this stake weight multiplier 
	staked_nodes: BigInt!

	# Unstaking nodes with this stake weight multiplier 
	unstaking_nodes: BigInt!

	# Staked nodes with this stake weight multiplier 
	jailed: BigInt!

	# Tokens of the nodes with this stake weight multiplier 
	tokens: BigInt!

	# Relays served by the nodes with this stake weight multiplier 
	relays: BigInt!

	# Rewards earned by serving relays by the nodes with this stake weight multiplier 
	rewards: BigInt!
}

type CountByCodeError {
	code: String
	counter: Int
}

type BlockRelaysByGatewayAndChain {
	# Id of the gateway 
	gateway: Int!

	# Id of the chain 
	chain: String!

	# Relays 
	relays: BigInt!

	# Tokens 
	tokens: BigInt!

	# Service multiplier (relays to token multiplier of the chain, if not defined then the default) 
	service_multiplier: BigInt!
	computed_units: Float!
}

type BlockRelaysByChain {
	# Id of the chain 
	chain: String!

	# Relays 
	relays: BigInt!

	# Tokens 
	tokens: BigInt!

	# Service multiplier (relays to token multiplier of the chain, if not defined then the default) 
	service_multiplier: BigInt!
	computed_units: Float!
}

type RelaysByChain {
	# Id of the chain 
	chain: String!

	# Relays 
	relays: BigInt!
}

type Block {
	# ID of the record 
	_id: ID!

	# Height of the block 
	height: Int!

	# Time of the block 
	time: String!

	# Producer of the block 
	producer: String

	# Relays to token multiplier param in this block 
	token_multiplier: Int!

	# Fee multiplier param in this block 
	fee_multiplier: Float!

	# Blocks per session param in this block 
	block_per_session: Int!

	# Supported chains param in this block 
	supported_block_chains: [String!]!

	# Amount of transactions (both valid and invalid) in this block 
	total_txs: Int!

	# Amount of nodes (staked, jailed, unstaking, unstaked) in this block 
	total_nodes: Int!

	# Amount of apps (staked, unstaking, unstaked) in this block 
	total_apps: Int!

	# Amount of accounts in this block 
	total_accounts: Int!

	# Amount of nodes jailed 
	nodes_jailed_staked: Int

	# Tokens staked of the nodes jailed 
	nodes_jailed_staked_tokens: BigInt

	# Amount of unjailed staked nodes 
	nodes_unjailed_staked: Int

	# Tokens (uPOKT) staked of the unjailed staked nodes 
	nodes_unjailed_staked_tokens: BigInt

	# Amount of unstaking nodes 
	nodes_unjailed_unstaking: Int

	# Tokens (uPOKT) of the unstaking nodes 
	nodes_unjailed_unstaking_tokens: BigInt

	# Amount of staked apps in this block 
	apps_staked: Int

	# Tokens (uPOKT) of the staked apps 
	apps_staked_tokens: BigInt

	# Amount of unstaking apps in this block 
	apps_unstaking: Int

	# Tokens (uPOKT) of the unstaking apps 
	apps_unstaking_tokens: BigInt

	# Tokens supply data 
	supply: BlockSupply!

	# Amount of nodes staked by chain 
	nodes_stake_by_chain: [StakeByChain]!

	# Amount of apps staked by chain 
	apps_stake_by_chain: [StakeByChain]!

	# Time in which this record was parsed from RPC to our database 
	parse_time: String!

	# Minutes the block took to be processed 
	took: Float!
	verified: Boolean

	# Total relays from proof transactions in this block 
	total_relays_completed: Int
	total_challenges_completed: Int

	# Total tokens minted in this block 
	total_minted: BigInt

	# Amount of valid transactions in this block 
	total_good_txs: BigInt

	# Amount of invalid transactions in this block 
	total_bad_txs: BigInt

	# Amount of valid proof transactions in this block 
	proof_msgs: Int

	# Array of object that contain the amount of invalid transactions by grouped by the result code 
	bad_txs_count_by_error: [CountByCodeError]

	# Size of the block in bytes 
	block_size: BigInt

	# Size of the state of this block in bytes 
	state_size: BigInt

	# Total size (sum block size + state size) in bytes 
	total_size: BigInt

	# Object that have the monetary fields 
	monetary: Monetary

	# Chain with more relays in this block 
	best_chain: String

	# Chain with more computed units in this block 
	best_computed_unit_chain: String

	# Amount of valid claim transactions in this block 
	claim_msgs: Int

	# DAO allocation param in this block 
	dao_allocation: Float

	# Multiplier that tells how many POKT the DAO will receive for each relay 
	dao_earning_multiplier: Float

	# Array containing the addresses of the new apps in this block 
	new_apps: [String]

	# Array containing the addresses of the new nodes in this block 
	new_nodes: [String]

	# Node allocation (100 - DAO allocation - Proposer allocation) in this block 
	node_allocation: Float

	# Multiplier that tells how many POKT the nodes will receive for each relay the node serves 
	node_earning_multiplier: Float

	# Proposer percentage param in this block 
	proposer_allocation: Float

	# Multiplier that tells how many POKT the producer will receive for each relay in the block 
	proposer_earning_multiplier: Float

	# Service URL of the producer of this block 
	producer_service_url: String

	# Amount of new apps in this block 
	total_new_apps: Int

	# Amount of new nodes in this block 
	total_new_nodes: Int

	# Array containing the relays by chain  
	total_relays_by_chain: [BlockRelaysByChain]

	# Array containing the relays by gateway and chain  
	total_relays_by_gateway: [BlockRelaysByGatewayAndChain]

	# Total relays from claim transactions in this block 
	total_relays_claimed: BigInt

	# Rewards (uPOKT) given to nodes for serving relays 
	node_rewards: BigInt

	# Rewards (uPOKT) given to block producer for producing the block 
	producer_rewards: BigInt

	# Rewards (uPOKT) given to DAO 
	dao_rewards: BigInt
	total_computed_units: Float
	delegator_rewards: BigInt
	returned_fees: BigInt

	# Array that contains a summary of the nodes for every stake weight multiplier on the block 
	stake_weight_summary: [StakeWeightSummary]

	# Array that contains the each stake weight multipliers on the block 
	stake_weight_tiers: [Float]

	# Amount of nodes that was unstaked in this block 
	total_unstaked_nodes: BigInt

	# Amount of apps that was unstaked in this block 
	total_unstaked_apps: BigInt
}

type ListPoktBlockResponse {
	# Blocks on this page 
	items: [Block]

	# Info related to the current page of the list 
	pageInfo: PaginationResponse
}

type PoktscanStatus {
	# Height of the latest block on the POKTscan database 
	poktscan_height: BigInt!

	# Height of the latest block on the network 
	network_height: BigInt!

	# True if POKTscan is synced with the network 
	is_sync: Boolean!

	# True if POKTscan is syncing it database with the network 
	is_syncing: Boolean!

	# Show how many blocks behind is POKTscan from the network 
	blocks_behind: BigInt!

	# Time of the latest block on the POKTscan database
	time: String
}

type NodeChainRelays {
	# Chain Id
	chain: String!

	# Relays served for this chain id
	relays: BigInt!
}

type Delegator {
	# Address of the account 
	address: String!

	# Percent of the rewards to share 
	share: Float!
}

type PendingClaims {
	# 0 is for RelaysEvidence and 1 for ChallengeEvidence 
	evidence_type: Int

	# Height in which the claim will expire 
	expiration_height: BigInt

	# Height of the session of the claim 
	session_height: BigInt

	# Amount of relays processed in this claim 
	total_proofs: BigInt

	# this will be the uPOKT you will receive when the pending claim is processed. Estimated because we do not know if
	# one parameter that interfere with the nodes earning multiplier (i.e. RelaysToTokenMultiplier) will change
	estimated_pokt: BigInt

	# Address of the app
	app: String

	# ChainID of the claim transaction
	chain: String
}

type PoktNode {
	# ID of the record
	_id: ID!

	# Time of the last block in which this node was scanned
	block_time: String!

	# Height of the last block in which this node was scanned
	height: Int!

	# Time in which this record was parsed from RPC to our database
	parse_time: String!

	# True if the node was the producer of the latest block
	producer: Boolean!

	# Public key of the node
	public_key: ID!

	# Address of the node (operator address)
	address: ID!

	# Address of the output address (if the node is custodial then it output address will be the operator address)
	output_address: ID!

	# Balance (in uPOKT) of the operator address
	balance: BigInt!

	# Balance of the output address (if the node is custodial then it output balance will be the operator balance)
	output_balance: BigInt

	# Status of the node. Can be: staked (2), unstaking (1) and unstaked (0)
	status: Int!

	# Service URL of the node
	service_url: String!

	# Service domain of the node
	service_domain: String!

	# Chain supported by this node
	chains: [String!]!

	# Tokens (in uPOKT) this node have staked/unstaking
	tokens: BigInt!

	# Time in which the node start the unstaking process
	unstaking_time: String!

	# True if the node is jailed
	jailed: Boolean!

	# How many blocks the node have not sign
	missed_signing_blocks_counter: Int!
	index_offset: Int!

	# How many blocks the node have been jailed
	jailed_blocks_counter: Int!

	# Date time when the node can be unjailed
	jailed_until: String!

	# Height of the block when the node staked for the first time
	start_height: Int!

	# Version of the node
	version: String!
	missing_blocks: Int

	# History about how many relays a node have served for each chain
	chains_history: [NodeChainRelays]

	# True if the node is custodial, if false then the node is non custodial
	custodial: Boolean

	# True if the node was a validator in the latest block
	validator: Boolean

	# Stake Weight multiplier of the node 
	stake_weight: Float

	# Claim relays waiting to receive the proof 
	total_pending_claim_relays: BigInt

	# this will be the uPOKT you will receive when the pending claims are processed. Estimated because we do not know if one
	# parameter that interfere with the nodes earning multiplier (i.e. RelaysToTokenMultiplier) will change.
	total_pending_claim_tokens: BigInt

	# Array of pending claims 
	pending_claims: [PendingClaims]

	# List of delegators of the node staked 
	reward_delegators: [Delegator]
}

type PoktNodeDomain {
	# Domain of the node runner
	service_domain: String!

	# How many nodes have this domain
	count: Int
}

type ListPoktNodeResponse {
	# Nodes on this page
	items: [PoktNode]

	# Info related to the current page of the list
	pageInfo: PaginationResponse
}

type PoktNodeError {
	# Address of the node
	address: ID!

	# Service URL of the node
	service_url: String!

	# Service domain of the node
	service_domain: String!

	# ChainId with which the node had the error
	blockchain: String

	# Date when the error was emitted
	timestamp: String
	method: String
	elapsedtime: Float

	# Error message
	message: String

	# Public key of the application with which the node had the error
	applicationpublickey: String

	# Public key of the node
	nodepublickey: String

	# Error code
	code: String
	bytes: Int
}

type NonCursorPagination {
	# Page number 
	page: Int!

	# Amount of items returned in the page
	pageSize: Int!

	# True if there is another page 
	hasNext: Boolean!
}

type ListPoktNodeErrorResponse {
	items: [PoktNodeError]!
	pageInfo: NonCursorPagination!
}

input ListPoktNodeErrorInput {
	addresses: [String!]!
	page: Int = 1
	limit: Int = 20
	sort: [SortInput!] = []
}

enum FieldsToSearch {
	# To search by the height of blocks 
	height

	# To search by the public key of nodes, accounts and apps 
	public_key

	# When you don't know for what field do you want to search 
	unknown

	# To search by the hash of transactions 
	hash

	# To search by the address of nodes, accounts and apps 
	address
}

type SearchItemMeta {
	# In this field will be the time of the block, if the search item is a block 
	time: String

	# If the search item is a node, then in this field would be the service url of the node 
	service_url: String

	# If the search item is a node, then in this field would be the service domain of the node 
	service_domain: String

	# If the search item is a node, then in this field would be the status of the node (2 for staked, 1 for unstaking and 0 for unstaked 
	status: Int

	# If the search item is a tx (transaction), then in this field would be the type of the transaction  
	type: String

	# If the search item is a tx (transaction), then in this field would be the result code of the transaction  
	result_code: Int

	# If the search item is a tx (transaction), then in this field would be true if the transaction is waiting to be indexed in a block 
	pending: Boolean
}

type SearchItem {
	# Entity of the result item. Can be: block, node, account, tx (for transaction) and app 
	entity: String!

	# If the search item is a tx (transaction), then in this field would be the hash of the transaction  
	hash: String

	# If the search item is a node, account or app, then in this field would be the address of the item 
	address: String

	# If the search item is block, then in this field would be the height of the block  
	height: BigInt

	# If the search item is a node, account or app and have public key, then in this field would be the public key of the item 
	public_key: String

	# If the search item is a node, then in this field would be the service domain of the node 
	service_domain: String

	# If the search item is a node, then in this field would be the service url of the node 
	service_url: String

	# metadata of the item 
	meta: SearchItemMeta
}

input SearchPoktEntitiesInput {
	# the text for which you would like to search 
	search_text: String!

	# the field for which you would like to search  
	search_field: FieldsToSearch!

	# The max amount of items you want to be returned. The max amount is 50, if you pass a greater value than 50 then 50 will be taken as items_to_return. 
	items_to_return: Int = 25
}

type Upgrade {
	# Height in which this feature or version will be activated. Only presented when a version is going to change.
	Height: BigInt

	# When a version is about to change, this present the version number, but when a feature is going to change this has as value FEATURE.
	Version: String

	# This has value when a version is about to change. This array when is not null have as item an string that have the
	# feature key and the height separated with a colon (:). When the height is 0 means the feature has been deactivated.
	Features: [String]
}

type Stake {
	# Chain supported by this node
	chains: [String]

	# Address of the output address (if the node is custodial then it output address will be the operator address)
	outputaddress: String

	# Address of the node
	address: String

	# Service URL of the node
	serviceurl: String

	# Tokens (in uPOKT) this node have staked.
	tokens: BigInt

	# List of delegators of the node 
	reward_delegators: [Delegator]
}

type AppStake {
	# Chains staked of this app.
	chains: [String!]

	# Tokens (in uPOKT) the app staked with.
	tokens: BigInt

	# Address of the app to where the app was migrated to. 
	migrated_to: String
}

type DelegatorReward {
	address: String!
	amount: BigInt!
	share: Float!
}

type RewardSplit {
	# Total coins (in uPOKT) pre-split 
	total: BigInt!

	# Total coins (in uPOKT) pre-split without fees 
	total_reward: BigInt!

	# Total fees (in uPOKT) 
	total_fees: BigInt!

	# PIP-32 returned fees (in uPOKT) 
	returned_fees: BigInt!

	# Amount (in uPOKT) sent to the operator (node address) 
	operator: BigInt!

	# Amount (in uPOKT) sent to the custodian (output address) 
	custodian: BigInt!

	# Address of the custodian of the node (output address) 
	custodian_address: String!

	# Collected fees (in uPOKT) of DAO 
	dao: BigInt!

	# Collected fees (in uPOKT) of proposer 
	proposer: BigInt!

	# Amount (in uPOKT) sent to each delegator of the node 
	delegators: [DelegatorReward!]!

	# Total amount (in uPOKT) sent to the delegators 
	total_delegator_rewards: BigInt!

	# Relays to token multiplier used for the calculation 
	chain_rttm: BigInt!

	# Relays to token multiplier source (can be default or per_chain) 
	chain_rttm_source: String!

	# Result of the division of chain (or default if the chain does not have one) relays to token multiplier by the default relays to token multiplier 
	service_multiplier: Float!

	# " Result of the multiplication of total relays by service multiplier 
	computed_units: Float!
	node_base_multiplier: Float!
	node_multiplier: Float!
}

type Transaction {
	# ID of the record
	_id: ID!

	# Hash of the transaction
	hash: String!

	# Height of the block in which the transaction occurred
	height: BigInt!

	# How many uPOKT was sent. 0 on all transactions except send transactions
	amount: BigInt

	# Time of the block in which the transaction occurred
	block_time: String!

	# The address of the account that execute the transaction
	from_address: String!

	# Index of the transaction in the block
	index: BigInt!

	# Custom message/description of the transaction that the sender put
	memo: String

	# Time in which this record was parsed from RPC to our database
	parse_time: String!

	# Result code of the transaction. If result code is 0 then the transaction is a valid one, otherwise is invalid
	result_code: BigInt!

	# Address of the account that received the transaction
	to_address: String!

	# Amount of uPOKT paid as fee
	total_fee: BigInt!

	# Amount of relays served. This is 0 in all transactions except in claim and proof transactions
	total_proof: String

	# Amount of uPOTK earned by serving the relays of this transaction. This is 0 in all transactions except in claim and proof transactions
	total_pokt: BigInt

	# The type of transaction
	type: String!

	# The chain that the node served relays. This is an empty string in all transactions except in claim and proof transactions
	chain: String

	# The app that the node served relays. This is an empty string in all transactions except in claim and proof transactions
	app_public_key: String

	# Hash of the claim transaction. This is an empty string in all transactions except in proof transactions
	claim_tx_hash: String

	# Height of the block in which the claim transaction will expire
	expiration_height: BigInt

	# Height of the block in which the node entered in session
	session_height: BigInt

	# True if the transaction is waiting to be indexed in a block
	pending: Boolean

	# If the type of the transaction is change_param then the key of the parameter changed in the transaction will be in this field
	change_param_key: String

	# If the type of the transaction is change_param then the value of the parameter changed in the transaction will be in this field
	change_param_value: String

	# If the type of the transaction is change_param then the previous value of the parameter changed in the transaction will be in this field
	change_param_prev_value: String

	# Info related to upgrade transactions
	upgrade: Upgrade

	# Info related to stake transactions
	stake: Stake

	# Action of the dao transfer transactions 
	action: String

	# Info related to app stake transactions 
	app_stake: AppStake

	# Reward split info, only presented in claim and proof transactions 
	reward_split: RewardSplit
}

type ListPoktTransactionResponse {
	# Transactions on the current page
	items: [Transaction]

	# Info related to the current page of the list
	pageInfo: PaginationResponse
}

type Transfer {
	# Hash of the transaction 
	tx_hash: String!

	# Height of the block in which the transaction occurred 
	height: Int!

	# How many uPOKT was sent. 
	amount: BigInt

	# Time of the block in which the transaction occurred 
	block_time: String!

	# The address of the account that execute the send transaction 
	from_address: String!

	# Custom message/description of the transaction that the sender put 
	memo: String

	# Time in which this record was parsed from RPC to our database 
	parse_time: String!

	# Result code of the transaction. If result code is 0 then the transaction is a valid one, otherwise is invalid 
	tx_result_code: Int!

	# Address of the account that received the transaction 
	to_address: String!

	# Amount of uPOKT paid as fee 
	fee: BigInt!

	# True if the transaction is waiting to be indexed in a block 
	pending: Boolean

	# This field will have value only when a node selection is passed.
	# In when a address of the node selection is the to_address, out when a address of the node selection is the from_address.
	flow: String
}

type ListPoktTransferResponse {
	# Transactions on the current page 
	items: [Transfer]

	# Info related to the current page of the list 
	pageInfo: PaginationResponse
}

type Query {
	# Get an account by it address or public key
	GetAccount(address: ID, public_key: ID): Account

	# List all the accounts in the history of the Pocket Network
	ListPoktAccount(pagination: ListInput): ListPoktAccountResponse!

	# List all the transactions in the history of the Pocket Network
	ListPoktTransaction(pagination: ListInput): ListPoktTransactionResponse

	# Get a transaction by its hash
	GetPoktTransaction(hash: ID!): Transaction

	# List all the transfers (send transactions) in the history of the Pocket Network
	ListPoktTransfer(pagination: ListInput): ListPoktTransferResponse

	# Get a send transaction by its hash
	GetPoktTransfer(tx_hash: ID!): Transfer

	# Get a node by its address
	# or service_url
	GetPoktNode(property: String, value: ID!): PoktNode

	# List all the nodes in the history of the Pocket Network
	ListPoktNode(pagination: ListInput): ListPoktNodeResponse

	# Get the sync status of POKTscan with the Pocket Network
	GetPoktscanStatus: PoktscanStatus

	# Get the domains that match with the search string passed and how many nodes have that domain
	ListPoktNodeDomains(search: String): [PoktNodeDomain]

	# List all the apps in the history of the Pocket Network
	ListPoktApp(pagination: ListInput): ListPoktAppResponse!

	# Get an app by it address
	GetPoktApp(address: ID!): App

	# List all the blocks in the history of the Pocket Network
	ListPoktBlock(pagination: ListInput): ListPoktBlockResponse!

	# Get a block by it height
	GetPoktBlock(height: Int!): Block

	# Search for nodes, accounts, blocks, apps and transactions.
	GetSearchPoktEntities(input: SearchPoktEntitiesInput!): [SearchItem]!

	# List the errors of the specified nodes.
	ListPoktNodeError(input: ListPoktNodeErrorInput!): ListPoktNodeErrorResponse!

	# Get the raw result of a transaction 
	GetRawPoktTransaction(hash: String!): String

	# Get the raw result of an account. If height not provided then the result of the last block is returned. 
	GetRawPoktAccount(address: String!, height: Int): String

	# Get the raw result of a node. If height not provided then the result of the last block is returned. 
	GetRawPoktNode(address: String!, height: Int): String

	# Get the raw result of an app. If height not provided then the result of the last block is returned. 
	GetRawPoktApp(address: String!, height: Int): String

	# Get the raw result of an block. If height not provided then the result of the last block is returned. 
	GetRawPoktBlock(height: Int): String

	# List the total of transactions by type between the date range specified.
	# If the strings of dates does not coincided with the format you will get an error.
	# Learn more about the format on the date_format input.
	GetTotalOfTransactionsByTypeBetweenDates(input: ListTotalOfTransactionsByTypeBetweenDatesInput!): [TotalByType]

	# List the total of transactions between the date range specified.
	# # If the strings of dates does not coincided with the format you will get an error.
	# # Learn more about the format on the date_format input.
	ListTotalOfTransactionBetweenDates(input: ListTotalOfTransactionBetweenDatesInput!): ListTotalOfTransactionBetweenDatesResponse!

	# Get a summary of nodes grouped by their version.
	GetNodesVersionReport: NodeVersionList

	# Get a summary of validator nodes grouped by their version.
	GetNodesConsensusReport: NodeConsensusResponse!

	# Get data of nodes grouped by largest node runners (domains).
	ListLargestNodeRunners(input: ListLargestNodeRunnersInput = { top: 50, sort_by: power}): LargestNodeRunnersList

	# Get the average of tokens staked by apps in the latest block of the date range selected and the average of relays by apps staked between the date range.
	GetStakedAndRelaysByAppsAveragesBetweenDates(input: GetStakedAndRelaysByAppsAveragesBetweenDatesInput!): StakedAndRelaysAverages!

	# Select apps with the filter input and with this apps you would get the total and average of tokens staked by apps in
	# the latest block and the average of relays by the apps staked between the date range.
	GetStakedAndRelaysByAppsAveragesByFilter(input: GetStakedAndRelaysByAppsAveragesByFilterInput): StakedAndRelaysAveragesAndTotals!

	# List how many apps support a chain in a certain block. If you no specify a block,
	# you will get the data based on the latest block.
	ListChainDistributionForApps(input: ListChainDistributionForAppsInput): [ChainDistributionForApp!]!

	# Divide the amount of apps in segments (ranges) based on the relays they have done between the date range
	GetAppsRelaysBySegmentsBetweenDates(input: GetAppsRelaysBySegmentsBetweenDatesInput!): [Segment!]!

	# Select nodes with the filter input and you will receive the sum of balance and tokens of that nodes
	GetNodesTotalBalanceAndTokensByFilter(input: GetNodesTotalBalanceAndTokensByFilterInput): TotalBalanceAndTokens!

	# Select accounts with the filter input and you will receive the sum of balance of that accounts
	GetAccountsTotalBalanceByFilter(input: GetAccountsTotalBalanceByFilterInput): TotalBalance!

	# List accounts with their percentage of how many pokt their have in comparison of the
	# total of pokt that all the accounts (wallets) had on the latest block.
	GetTopAccountsByBalance(input: GetAccountsDistributionByAmountInput = { top: 5}): [AccountDistribution]!

	# Get rewards info grouped by chain between the date range selected.
	GetChainsRewardsBetweenDates(input: GetChainsRewardsBetweenDatesInput!): [ChainRewards]!

	# Get data related to the network in general, between the date range selected and grouped by the unit time and interval selected.
	# View the fields comments to be able to understand what this query return.
	ListSummaryBetweenDates(input: SummaryWithBlockInput!): SummaryResponse!

	# Get data related to the network in general, between the date range selected. View the fields comments to be able to understand what this query return.
	GetNetworkSummaryBetweenDates(input: GetNetworkSummaryBetweenDatesInput!): NetworkSummary

	# Get the latest block and validator data
	GetLatestBlock: LatestBlock!

	# Get the amount of nodes by stake weight.
	# You can pass a block height. If you do not pass a block height, the last block will be considered.
	GetServicerStakeWeightDistribution(input: GetServicerStakeWeightDistributionInput): GetServicerStakeWeightDistributionResponse

	# Get the latest report of the network earn performance. The average of pokt no consider the stake weight multiplier, it just the base pokt (relays * base node multiplier)
	GetNetworkEarnPerformanceReport: NetworkEarnPerformance!

	# Get the amount of nodes validators divided by segments (ranges) of the staked tokens.
	# Each range have the length of the average unless is the first and last segment.
	GetValidatorsStakedTokensDistribution: GetValidatorsStakedTokensDistributionResponse!

	# List the history of changes for nodes
	ListPoktNodeHistory(input: HistoryInput!): ListHistoryResponse!

	# Get totals and averages of the relays and rewards generated by staked nodes grouped by their bin (stake weight multiplier) between dates.
	GetRewardsByStakeWeightBetweenDates(input: GetRewardsByStakeWeightBetweenDatesInput!): [StakeWeightRewardsItem]!

	# Get a summary for the nodes selection you pass.
	# If you pass addresses then service_urls, service_domain and output_address are not considered.
	# If you pass service_domain then service_urls and output_address are not considered.
	# If you pass output_address then service_urls is not considered.
	GetSummaryForNodeSelection(input: NodeSelectionInput!): SummaryForNodeSelection!

	# Get total and avg of the relays and rewards for the selected nodes.
