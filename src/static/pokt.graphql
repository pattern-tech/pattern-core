type AccountDistribution {
	# This will be the address of the account or the string "Others" specifying that all the accounts that are not in one point are grouped in this point 
	point: String!

	# Balance (in uPOKT) of the account or the sum of balance of all the accounts considered in the point "Others" 
	balance: BigInt!

	# Percentage of the balance of the account or the percentage of the sum of balance of all the accounts considered in the point "Others" 
	percentage: Float!
}

input GetAccountsDistributionByAmountInput {
	# How many accounts you would like to get in order descending by the balance. Also you would receive another point called "Other" to group all the accounts not considered on the top 
	top: Int = 5
}

type TotalBalance {
	# Sum of the balance (in uPOKT) of the accounts
	total_balance: BigInt!
}

input GetAccountsTotalBalanceByFilterInput {
	# Input to be able to specify the filter of the accounts you want to be considered
	filter: FilterInput!
}

input BetweenDatesInput {
	# Start date of the date range.
	start_date: String!

	# End date of the date range.
	end_date: String!

	# This is the format to convert the string to date. By default is: YYYY-MM-DD.
	# But if you want to use another format supported by momentjs you can pass it here.
	# More about momentjs formats: https://momentjs.com/docs/#/displaying/format/
	# When using hour as unit_time we recommend to use YYYY-MM-DDTHH:mm:ss.SSSZ as format.
	date_format: String = "YYYY-MM-DD"

	# Pass the timezone of the start date and end date. By default is UTC.
	# # List of supported timezones: https://gist.github.com/diogocapela/12c6617fc87607d11fd62d2a4f42b02a#file-moment-js-timezones-txt
	timezone: String = "UTC"

	# By default is false. When false, the start date you pass is converted to the start of the day and the end date is converted
	# to the end of the day. When true, the start and end date are considered as you pass.
	# Example: When false, if you pass the start date as 2023-05-05 and end date as 2023-05-06 the query will cover the following
	# range from 2023-05-05T00:00:00.000Z to 2023-05-06T23:59:59.999Z and when true, if you pass the start date as 2023-05-05 and
	# end date as 2023-05-06 the query will cover the following range from 2023-05-05T00:00:00.000Z to 2023-05-06T00:00:00.000Z.
	exclusive_date: Boolean = false
}

type AmountByBlock {
	# Height of the block. 
	point: String!

	# Amount (in uPOKT). 
	amount: BigInt!

	# Height of the block. 
	height: BigInt!

	# Time of the block. 
	block_time: String!
}

type StakedAndRelaysAverages {
	# Average of the tokens (in uPOKT) staked by the apps staked in the highest block
	avg_staked: Float!

	# Average of relays by the apps staked. This is a weighted average where we sum the amount of relays of every block and divide it by the sum of apps staked on every block and then multiply this value with the amount of blocks
	avg_relays: Float!
}

type StakedAndRelaysAveragesAndTotals {
	# Average of the tokens (in uPOKT) staked by the apps/nodes staked in the latest block
	avg_staked: Float!

	# Total tokens (in uPOKT) staked by apps/nodes in the latest block
	total_staked: BigInt!

	# Average of relays by the apps/nodes staked. To get this average we sum the amount of relays between the last hours selected, divide it by the division of the sum of hours working of each app/node between the hours selected by the hours selected
	avg_relays: Float!

	# Sum of the relays in the last hours selected
	total_relays: BigInt!
}

input GetStakedAndRelaysByAppsAveragesBetweenDatesInput {
	# Start date of the date range.
	start_date: String!

	# End date of the date range.
	end_date: String!

	# This is the format to convert the string to date. By default is: YYYY-MM-DDTHH:mm:ss.SSSZ.
	# But if you want to use another format supported by momentjs you can pass it here.
	# More about momentjs formats: https://momentjs.com/docs/#/displaying/format/
	date_format: String = "YYYY-MM-DDTHH: mm: ss.SSSZ"

	# Pass the timezone of the start date and end date. By default is UTC.
	# # List of supported timezones: https://gist.github.com/diogocapela/12c6617fc87607d11fd62d2a4f42b02a#file-moment-js-timezones-txt
	timezone: String = "UTC"
}

input GetStakedAndRelaysByAppsAveragesByFilterInput {
	# Input to be able to specify the filter of the apps you want to be considered
	filter: FilterInput

	# Specifies how many hours you want to go back from the current time. For example: actual time is 2022-09-06T12:15:01.234Z and you specify hours as 24, then the considered range will be: 2022-09-05T12:15:01.234Z as start date and 2022-09-06T12:15:01.234Z as end date
	hours: Int = 24
}

type ChainDistributionForApp {
	# ChainId
	chain: String!

	# Amount of apps that support this chainId
	apps: BigInt!

	# Percentage of the amount of apps that support this chainId
	percentage: Float!
}

input ListChainDistributionForAppsInput {
	# Height of the block in which the chain distribution by apps will be looked. If you do not pass any value the latest block will be considered. By default nothing is passed.
	height: Int
}

type Segment {
	# Segment (range) identifier (ID)
	segment: Int!

	# Amount in which the segment starts
	start: Float

	# Amount in which the segment ends. If null that means the end it's the infinite
	end: Float

	# Amount of items between the ranges (start and end) of the segment
	count: Int!
}

input GetAppsRelaysBySegmentsBetweenDatesInput {
	# Start date of the date range.
	start_date: String!

	# End date of the date range.
	end_date: String!

	# This is the format to convert the string to date. By default is: YYYY-MM-DDTHH:mm:ss.SSSZ.
	# But if you want to use another format supported by momentjs you can pass it here.
	# More about momentjs formats: https://momentjs.com/docs/#/displaying/format/
	date_format: String = "YYYY-MM-DDTHH: mm: ss.SSSZ"

	# How many segments do you want. Each segment will have a range of the value you specify
	# on relays_on_every_segments.
	segments: Int!

	# How many relays do you want on every segment.
	relays_on_every_segments: Float!

	# Pass the timezone of the start date and end date. By default is UTC.
	# # List of supported timezones: https://gist.github.com/diogocapela/12c6617fc87607d11fd62d2a4f42b02a#file-moment-js-timezones-txt
	timezone: String = "UTC"

	# Pass an array of chains to filter app relays by chains. By default will include all chains.
	chains: [String!] = []
}

type TookAndSizeAverage {
	# Average of the minutes the blocks took to be finished
	took_avg: Float!

	# Average of total size (in bytes) considering the blocks and states sizes
	size_avg: Float!
}

type NetworkSummary {
	# Height of the highest block in the range
	last_height: BigInt

	# Height of the lowest block in the range
	first_height: BigInt

	# Sum of the relays of every block in the range
