	node_selection: NodeSelectionInput!

	# When General is specified, you only will get the total relays and rewards in general.
	# When Nodes is specified, you will get the total rewards and relays in general and the rewards by node.
	# When Chains is specified, you will get the total rewards and relays in general, the rewards by nodes and the rewards by chain for each node.
