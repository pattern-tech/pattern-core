# Get the change and current amount from the start date and the current date.
# To get the change amount we look for the amount between the start date and the previous date.
# The previous date is the date resulting of subtract the time difference between the start date and the end date to the start date.
type CurrentLastAndChange {
	# Amount from the start date to the current date
	current: BigInt!

	# Amount from the previous date to the start date
	previous: BigInt!

	# Difference between current and last. This is calculated in the following way: current - last
	change_amount: BigInt!

	# Percentage Difference between current and last. This is calculated in the following way: ((current - last) / last) * 100
	change_percentage: Float!
}

type GetSupplySummaryFromStartDateResponse {
	# Value of the burn per year (in uPOKT). This is calculated in the following way: t * (365 / d).
	# # Where: t is the total burn between start and current date and d is the number of days between the start and the current date.
	burn_per_year: Float!

	# Value of the issuance per year (in uPOKT). This is calculated in the following way: t * (365 / d).
	# # Where: t is the total uPOKT minted between start and current date and d is the number of days between the start and the current date.
	issuance_per_year: Float!

	# Percentage of the supply growth per year. This is calculated in the following way: (((m - b) * (365/ d))  / s) * 100.
	# # Where: m is the total uPOKT minted between start and current date, b is the total burn between the start and current
	# date, s is the current total supply and d is the number of days between the start and the current date.
	supply_growth_per_year: Float!

	# Total uPOKT burned between the start and current date including the change amount and percentage.
	total_burned: CurrentLastAndChange!

	# Total uPOKT minted between the start and current date including the change amount and percentage.
	total_minted: CurrentLastAndChange!

	# Total supply (in uPOKT) between the start and current date including the change amount and percentage.
	total_supply: CurrentLastAndChange!

	# Total monetary base (in uPOKT) between the start and current date including the change amount and percentage.
	mb: CurrentLastAndChange!

	# Liquid uPOKT (amount of uPOKT in wallets) between the start and current date including the change amount and percentage.
	m0: CurrentLastAndChange!

	# Staked uPOKT (amount of uPOKT staked by nodes and apps) between the start and current date including the change amount and percentage.
	ms: CurrentLastAndChange!

	# Unstaking uPOKT (amount of uPOKT in process of unstaking by nodes and apps) between the start and current date including the change amount and percentage.
	mu: CurrentLastAndChange!
}

